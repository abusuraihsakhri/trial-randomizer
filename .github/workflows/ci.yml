name: Trial Randomizer CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python source
        run: python -m compileall -q trial_randomizer agents cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate browser JavaScript
        if: matrix.python-version == '3.12'
        run: node --check web/app.js
      - name: Build distribution
        if: matrix.python-version == '3.12'
        run: python -m pip wheel --no-deps --wheel-dir /tmp/trial-randomizer-wheel .
