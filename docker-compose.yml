services:
  trial-randomizer:
    build: .
    container_name: trial-randomizer
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY before starting}
      TRIAL_RANDOMIZER_API_KEY: ${TRIAL_RANDOMIZER_API_KEY:?Set TRIAL_RANDOMIZER_API_KEY before starting}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
